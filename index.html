<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>限時限量美食福利發放中！</title>
    <!-- 引入 Tailwind CSS 快速渲染樣式 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* 讓按鈕有呼吸、吸引人點擊的動態效果 */
        @keyframes pulse-orange {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { transform: scale(1.03); box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0); }
        }
        .animate-pulse-btn {
            animation: pulse-orange 2s infinite;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900 select-none">

    <!-- 主容器：鎖定手機寬度，置中顯示 -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col justify-between">
        
        <!-- 上半部：強烈視覺與極致誘因 -->
        <div>
            <!-- 1. 頂部令人垂涎的美食大圖 -->
            <div class="relative w-full h-64 bg-gray-200 overflow-hidden">
                <!-- 💡 請將 src 後面的網址換成您最厲害的美食照片網址 -->
                <img src="https://unsplash.com" 
                     alt="招牌美食" class="w-full h-full object-cover">
                <!-- 頂部紅色限時標籤 -->
                <div class="absolute top-4 left-4 bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-lg">
                    🔥 今日限定活動
                </div>
            </div>

            <!-- 2. 純吸粉核心：標題與急迫感 -->
            <div class="p-6 text-center">
                <h1 class="text-2xl font-extrabold text-red-600 tracking-tight leading-snug mb-2">
                    進群免費領「招牌私房小菜」！
                </h1>
                <p class="text-gray-600 text-base font-medium mb-4">
                    只要 3 秒鐘加入 LINE，立刻打包外帶好康 🎁
                </p>

                <!-- 倒數急迫感區塊（吸粉關鍵） -->
                <div class="bg-red-50 border border-red-200 rounded-2xl p-4 mb-6">
                    <div class="flex justify-center items-center gap-2 text-sm text-red-700 font-bold mb-1">
                        <span class="inline-block w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                        <span>活動倒數中！本波名額僅剩 37 位</span>
                    </div>
                    <p class="text-xs text-gray-500">已有 1,428 位吃貨成功領取福利</p>
                </div>
                
                <!-- 3. 超巨大行動按鈕 (CTA) -->
                <!-- 💡 請將 href 裡面的網址換成您的 LINE 加好友連結 -->
                <a href="https://line.me" 
                   target="_blank"
                   class="animate-pulse-btn block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-xl py-5 rounded-2xl shadow-lg transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-3">
                    <!-- LINE 圖標 (SVG) -->
                    <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
                        <path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.604.391.084.922.258 1.057.592.12.301.079.771.038 1.077l-.164 1.031c-.049.303-.24 1.187 1.031.647 1.271-.54 6.844-4.029 9.328-6.9a8.91 8.91 0 0 0 2.674-6.183zm-15.541 3.51c-.439 0-.795-.356-.795-.795v-4.144c0-.439.356-.795.795-.795s.795.356.795.795v4.144c0 .439-.356.795-.795.795zm3.896 0c-.439 0-.795-.356-.795-.795v-4.144c0-.439.356-.795.795-.795s.795.356.795.795v4.144c0 .439-.356.795-.795.795zm3.238-.795c0 .439-.356.795-.795.795h-1.646c-.439 0-.795-.356-.795-.795v-4.144c0-.439.356-.795.795-.795s.795.356.795.795v1.27h.851c.439 0 .795.356.795.795s-.356.795-.795.795h-.851v1.284h1.646c.439 0 .795.356.795.795zm4.444 0c0 .439-.356.795-.795.795h-1.646c-.439 0-.795-.356-.795-.795v-4.144c0-.439.356-.795.795-.795s.795.356.795.795v4.144z"/>
                    </svg>
                    <span>點我加 LINE 領取福利</span>
                </a>

                <!-- 簡單承諾，降低防備心 -->
                <p class="text-xs text-gray-400 mt-4 flex items-center justify-center gap-1">
                    🔒 點擊將自動開啟 LINE 應用程式 | 個資安全加密保護
                </p>
            </div>
        </div>

        <!-- 4. 底部極簡免責與版權（純吸粉頁不需要雜亂資訊） -->
        <div class="p-6 bg-gray-50 text-center border-t border-gray-100">
            <p class="text-[10px] text-gray-400 leading-relaxed">
                活動最終解釋權歸店家所有。本活動與 LINE 官方無關。<br>
                © 2026 美食好康推薦情報站. All Rights Reserved.
            </p>
        </div>

    </div>

</body>
</html>
