<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전문가 1대1 실시간 상담실</title>
    <!-- 引入 Tailwind CSS 提供精美版面排版 -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://jsdelivr.net');
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: #f8fafc;
        }

        /* 隐藏原生 Tawk.to 圆形小图标，防止破坏您精美的界面 */
        iframe[title="화상 채팅 전화를 수락함"], 
        .tawk-min-container,
        #tawk-chatpanel,
        iframe[id^="tawk-"] {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(20px);
            transition: all 0.3s ease-in-out;
        }
        
        /* 当 Tawk.to 大窗被唤醒展开时，恢复显示 */
        body.tawk-open iframe[id^="tawk-"] {
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 999999 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 pt-8 bg-slate-50 antialiased pb-24">

    <!-- 核心主容器（对应您图片中的白色主板） -->
    <div class="w-full max-w-[440px] bg-white rounded-3xl border border-slate-200 shadow-[0_15px_40px_-10px_rgba(0,0,0,0.05)] p-6 space-y-6 flex flex-col text-center">
        
        <!-- 顶部主标题 -->
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">전문가 1대1 실시간 온라인 답변</h1>
            <p class="text-xs text-slate-500 leading-relaxed max-w-[90%] mx-auto font-medium">
                아래 버튼을 누르면 즉시 이동하며, 별도의 인증 없이 빠른 추가 후 바로 궁금한 점을 안내해 드립니다.
            </p>
        </div>

        <!-- 核心卖点清单（对应您图片中的勾选列表） -->
        <div class="text-left bg-slate-50/50 rounded-2xl p-4 border border-slate-100 space-y-3 mx-auto w-full">
            <div class="flex items-center gap-2.5">
                <span class="text-emerald-500 font-bold text-sm">✓</span>
                <span class="text-xs text-slate-700 font-semibold">전문 컨설턴트 팀의 전과정 비공개 상담</span>
            </div>
            <div class="flex items-center gap-2.5 border-t border-slate-100 pt-2.5">
                <span class="text-emerald-500 font-bold text-sm">✓</span>
                <span class="text-xs text-slate-700 font-semibold">개인 상황에 맞춘 1:1 맞춤형 솔루션 제공</span>
            </div>
            <div class="flex items-center gap-2.5 border-t border-slate-100 pt-2.5">
                <span class="text-emerald-500 font-bold text-sm">✓</span>
                <span class="text-xs text-slate-700 font-semibold">번거로운 회원가입 불필요, 즉시 문의 가능</span>
            </div>
        </div>

        <!-- 【图片红框核心区】并排双通道直聊大按钮 -->
        <div class="grid grid-cols-2 gap-3 w-full pt-2">
            <!-- KakaoTalk 大按钮 -->
            <button onclick="triggerTawkTo()" class="bg-[#FEE500] hover:bg-[#efd700] active:scale-[0.98] text-[#191919] font-black text-xs py-4 px-2 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition-all shadow-md shadow-yellow-500/5">
                <span class="w-6 h-6 bg-[#191919] rounded-lg text-[#FEE500] text-[10px] font-black flex items-center justify-center">TALK</span>
                <span>카카오톡 문의하기</span>
            </button>

            <!-- LINE 大按钮 -->
            <button onclick="triggerTawkTo()" class="bg-[#06C755] hover:bg-[#05b34c] active:scale-[0.98] text-white font-black text-xs py-4 px-2 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition-all shadow-md shadow-emerald-500/5">
                <span class="w-6 h-6 bg-white rounded-full text-[#06C755] text-[12px] font-black flex items-center justify-center">L</span>
                <span>라인(LINE) 문의하기</span>
            </button>
        </div>

    </div>

    <!-- 【底部署名固定悬浮条】对应图片最下方，完美升级为双色拼盘样式 -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-[420px] z-50 overflow-hidden rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.15)] grid grid-cols-2">
        <!-- 左半边：Kakao 拦截触发 -->
        <button onclick="triggerTawkTo()" class="bg-[#FEE500] hover:bg-[#efd700] text-[#191919] font-bold text-xs py-3.5 flex items-center justify-center gap-1.5 transition-colors border-r border-[#191919]/5">
            <span class="w-4 h-4 bg-[#191919] rounded text-[#FEE500] text-[8px] font-black flex items-center justify-center">TALK</span>
            <span>카톡 실시간 상담</span>
        </button>
        <!-- 右半边：LINE 拦截触发 -->
        <button onclick="triggerTawkTo()" class="bg-[#06C755] hover:bg-[#05b34c] text-white font-bold text-xs py-3.5 flex items-center justify-center gap-1.5 transition-colors">
            <span class="w-4 h-4 bg-white rounded-full text-[#06C755] text-[10px] font-black flex items-center justify-center">L</span>
            <span>라인 실시간 상담</span>
        </button>
    </div>


    <!-- ================================================== -->
    <!-- 官方 TAWK.TO 核心集成（完美无缝高穿透版） -->
    <!-- ================================================== -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    
    Tawk_API.onChatMaximized = function(){
        document.body.classList.add('tawk-open');
    };
    Tawk_API.onChatMinimized = function(){
        document.body.classList.remove('tawk-open');
    };

    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script");
    s1.async=true;
    s1.src='https://tawk.to';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    
    <script>
        // 一键高透穿透映射函数：无论点哪个按钮，均可拉开全屏独立直聊窗
        function triggerTawkTo() {
            if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
                window.Tawk_API.maximize();
            } else {
                alert("상담 채널에 안전하게 암호화 연결 중입니다. 잠시 후 다시 클릭해주세요.");
            }
        }
    </script>

</body>
</html>
