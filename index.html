<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비밀 톡 - Secret Link 1:1</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://jsdelivr.net');
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed;
        }

        .aurora-bg {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 130%;
            height: 60%;
            background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, rgba(168,85,247,0.15) 40%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            animation: auroraMove 10s infinite alternate ease-in-out;
        }

        @keyframes auroraMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 8%) scale(1.1); opacity: 0.8; }
        }

        /* 隐藏原生 Tawk.to 挂件 */
        iframe[title="화상 채팅 전화를 수락함"], 
        .tawk-min-container,
        #tawk-chatpanel,
        iframe[id^="tawk-"] {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: all 0.3s ease-in-out;
        }
        
        body.tawk-open iframe[id^="tawk-"] {
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 999999 !important;
        }

        .dot-pulse {
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dot-pulse:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-4px); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 antialiased overflow-hidden relative">

    <div class="aurora-bg"></div>

    <!-- 核心主容器 -->
    <div class="w-full max-w-[430px] h-[90vh] max-h-[800px] bg-slate-900/60 border border-white/10 rounded-[38px] p-5 shadow-[0_30px_70px_rgba(0,0,0,0.5)] backdrop-blur-2xl flex flex-col text-center justify-between relative z-10">
        
        <!-- 头部 -->
        <div class="flex justify-between items-center px-2 pt-2">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
                </span>
                <span class="text-xs text-indigo-200/70 font-semibold uppercase">Secure Connect</span>
            </div>
            <div class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded-full font-bold">
                🟢 상담원 대기중
            </div>
        </div>

        <!-- 聊天信息展示区 -->
        <div id="custom-chat-box" class="flex-1 overflow-y-auto my-4 p-2 space-y-4 flex flex-col text-left">
            <div class="text-center my-1">
                <span class="text-[10px] bg-white/5 text-slate-400 px-3 py-1 rounded-xl">
                    🔒 1:1 실시간 보안 암호화 채널이 개설되었습니다
                </span>
            </div>

            <!-- 小姐姐话术 -->
            <div class="flex flex-col items-start max-w-[85%]">
                <div class="bg-white/10 text-slate-100 rounded-[20px] rounded-tl-none px-4 py-2.5 text-sm leading-relaxed">
                    안녕하세요! 무엇을 도와드릴까요? 상담을 시작하려면 아래에 메시지를 입력하시거나 버튼을 눌러주세요. ✨
                </div>
            </div>

            <!-- 动态消息插入锚点 -->
            <div id="typing-box" class="flex items-center gap-1 bg-white/5 px-4 py-3 rounded-[20px] rounded-tl-none w-16 shadow-inner">
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full dot-pulse"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full dot-pulse"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full dot-pulse"></span>
            </div>
        </div>

        <!-- 引流与输入区域 -->
        <div class="space-y-3">
            <div class="bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs text-slate-400 flex items-center justify-between shadow-inner">
                <!-- 真实输入框，如果 Tawk 挂了，输入文字按回车也能直接在网页里聊 -->
                <input id="custom-input" type="text" placeholder="여기에 메시지를 입력하세요..." class="bg-transparent w-full text-white outline-none placeholder:text-slate-500" onkeypress="if(event.key === 'Enter') handleUserSend()">
                <span onclick="handleUserSend()" class="text-indigo-400 font-bold ml-2 cursor-pointer">전송</span>
            </div>

            <button onclick="triggerTawkTo()" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:opacity-95 active:scale-[0.98] text-white font-bold text-sm py-4 rounded-2xl transition-all shadow-lg flex items-center justify-center gap-2">
                💬 카카오톡 / 라인 실시간 상담 연동
            </button>
        </div>
    </div>

    <!-- Tawk.to 底层代码 -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    Tawk_API.onChatMaximized = function(){ document.body.classList.add('tawk-open'); };
    Tawk_API.onChatMinimized = function(){ document.body.classList.remove('tawk-open'); };

    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://tawk.to';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    
    <script>
        const chatBox = document.getElementById('custom-chat-box');

        // 用户发送消息处理
        function handleUserSend() {
            const input = document.getElementById('custom-input');
            const text = input.value.trim();
            if(!text) return;

            // 渲染用户发送的气泡
            const userMsg = document.createElement('div');
            userMsg.className = 'flex flex-col items-end align-self-end w-full pl-12';
            userMsg.innerHTML = `<div class="bg-indigo-600 text-white rounded-[20px] rounded-tr-none px-4 py-2.5 text-sm max-w-[85%] ml-auto">${text}</div>`;
            chatBox.appendChild(userMsg);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 触发保底：1秒后自动唤醒 Tawk.to，或弹出客服已满提示引导去加 Kakao
            setTimeout(() => {
                triggerTawkTo();
            }, 1000);
        }

        function triggerTawkTo() {
            if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
                window.Tawk_API.maximize();
            } else {
                // 如果 Tawk 系统彻底不在线或断网，执行最终引流兜底方案
                alert("현재 실시간 대화창이 포화 상태입니다. 잠시 후 새로고침 후 다시 시도하시거나, 안내에 따라 카카오톡 채널을 추가해 주세요.");
            }
        }

        // 3秒后模拟客服小姐姐发出指令
        setTimeout(() => {
            const typingBox = document.getElementById('typing-box');
            if (typingBox) {
                typingBox.remove();
                const replyMsg = document.createElement('div');
                replyMsg.className = 'flex flex-col items-start max-w-[85%]';
                replyMsg.innerHTML = `<div class="bg-white/10 text-slate-100 rounded-[20px] rounded-tl-none px-4 py-2.5 text-sm">연결이 원활하지 않을 경우 아래 버튼을 눌러 카카오톡 고객센터로 직접 문의하실 수 있습니다. 🥰</div>`;
                chatBox.appendChild(replyMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }, 3000);
    </script>
</body>
</html>
