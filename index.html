<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1:1 프라이빗 마음 커넥트 - Live Chat</title>
    <!-- 引入 Tailwind CSS 构建现代流体美学 -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* 引入韩国高端科技开源字体 Pretendard */
        @import url('https://jsdelivr.net');
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed;
        }

        /* 极光流动背景动效 */
        .aurora-bg {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 130%;
            height: 60%;
            background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, rgba(168,85,247,0.15) 40%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            animation: auroraMove 10s infinite alternate ease-in-out;
        }

        @keyframes auroraMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 8%) scale(1.1); opacity: 0.8; }
        }

        /* 隐藏原生 Tawk.to 圆形小绿图标以保持整体神圣的高级感 */
        iframe[title="화상 채팅 전화를 수락함"], 
        .tawk-min-container,
        #tawk-chatpanel,
        iframe[id^="tawk-"] {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.95) translateY(15px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* 当 Tawk.to 大窗弹窗被触发最大化时无缝浮现 */
        body.tawk-open iframe[id^="tawk-"] {
            opacity: 1 !important;
            pointer-events: auto !important;
            transform: scale(1) translateY(0) !important;
            z-index: 999999 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 antialiased overflow-hidden relative selection:bg-indigo-500 selection:text-white">

    <!-- 极光光晕背景 -->
    <div class="aurora-bg"></div>

    <!-- 核心主容器 (毛玻璃科技卡片) -->
    <div class="w-full max-w-[430px] bg-slate-900/60 border border-white/10 rounded-[38px] p-6 shadow-[0_30px_70px_rgba(0,0,0,0.5)] backdrop-blur-2xl flex flex-col text-center space-y-6 relative z-10 transition-all duration-300 hover:border-white/15">
        
        <!-- 头部闪烁状态栏 -->
        <div class="flex justify-between items-center px-2">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
                </span>
                <span class="text-xs text-indigo-200/70 font-semibold tracking-wide uppercase">Connect Room</span>
            </div>
            <div class="text-[11px] bg-white/5 border border-white/10 text-indigo-300 px-3 py-1 rounded-full font-bold">
                비공개 매칭 100%
            </div>
        </div>

        <!-- 视觉高光区：3D立体动感气泡图标 -->
        <div class="relative py-4">
            <div class="mx-auto w-20 h-20 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-3xl flex items-center justify-center text-4xl shadow-[0_15px_30px_rgba(99,102,241,0.3)] animate-pulse">
                ✨
            </div>
            <!-- 漂浮装饰圈 -->
            <div class="absolute top-2 left-[28%] w-4 h-4 bg-pink-400/30 rounded-full blur-[1px]"></div>
            <div class="absolute bottom-2 right-[28%] w-3 h-3 bg-cyan-400/40 rounded-full blur-[1px]"></div>
        </div>

        <!-- 治愈系走心文案 (转化率极高) -->
        <div class="space-y-2">
            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-100 to-purple-200 tracking-tight leading-tight">
                지금, 당신만을 위한<br>1:1 비밀 대화가 열립니다
            </h2>
            <p class="text-xs text-slate-400 leading-relaxed max-w-[90%] mx-auto font-medium">
                가벼운 일상 이야기부터 어디에도 말하지 못했던 비밀까지, 실시간으로 매칭된 전담 파트너와 안전하게 소통하세요.
            </p>
        </div>

        <!-- 模块：三大安全保障承诺（拉满粉丝下决心点击的信任感） -->
        <div class="bg-white/[0.03] border border-white/[0.05] rounded-2xl p-4 text-left space-y-3">
            <div class="flex items-center gap-3">
                <span class="text-base">🤫</span>
                <span class="text-xs text-slate-300 font-semibold">닉네임 자동 생성 (회원가입/인증 없음)</span>
            </div>
            <div class="flex items-center gap-3 border-t border-white/[0.04] pt-2.5">
                <span class="text-base">🔒</span>
                <span class="text-xs text-slate-300 font-semibold">모든 대화 실시간 종단간 암호화 보안</span>
            </div>
            <div class="flex items-center gap-3 border-t border-white/[0.04] pt-2.5">
                <span class="text-base">🗑️</span>
                <span class="text-xs text-slate-300 font-semibold">채팅창을 나가는 즉시 데이터 즉시 파기</span>
            </div>
        </div>

        <!-- 主核心操作区域 (流光呼吸渐变按钮) -->
        <div class="space-y-3 pt-2">
            <button onclick="triggerTawkTo()" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:opacity-95 active:scale-[0.98] text-white font-bold text-base py-4 rounded-2xl transition-all shadow-[0_12px_25px_rgba(99,102,241,0.25)] flex items-center justify-center gap-2">
                💬 1:1 익명 비밀 대화방 입장하기
            </button>
            
            <p class="text-[10px] text-slate-500 tracking-tight">
                * 본 플랫폼은 대화 도중의 그 어떤 개인정보도 수집하지 않습니다.
            </p>
        </div>

    </div>

    <!-- 拦截触发框栏 (即便不点击中央按钮，点击屏幕底部输入框也能无缝穿透唤醒大窗) -->
    <div class="w-full max-w-[430px] mt-4 px-4 relative z-10">
        <div class="bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs text-slate-500 cursor-pointer flex items-center justify-between shadow-inner" onclick="triggerTawkTo()">
            <span>메시지를 입력하여 대화를 시작하세요...</span>
            <span class="text-[10px] text-indigo-400 font-bold tracking-wider uppercase">secure 🔒</span>
        </div>
    </div>


    <!-- ================================================== -->
    <!-- 4. 官方 TAWK.TO 底层通信框架 (完美去错修正版) -->
    <!-- ================================================== -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    
    // Tawk 状态监听：当大窗弹出时，给 body 挂载全局样式类，使动画无缝契合
    Tawk_API.onChatMaximized = function(){
        document.body.classList.add('tawk-open');
    };
    Tawk_API.onChatMinimized = function(){
        document.body.classList.remove('tawk-open');
    };

    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0]; // 精确锚定 节点，彻底修复浏览器白屏bug
    s1.async=true;
    s1.src='https://tawk.to'; // 已剔除空格错误
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    
    <script>
        // 核心高穿透性唤醒函数
        function triggerTawkTo() {
            if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
                window.Tawk_API.maximize();
            } else {
                // 如果网络拉取中出现毫秒级延迟，弹出顶级科技感平滑韩文通告
                alert("보안 채널을 암호화 연결 중입니다. 잠시 후 다시 클릭해주세요.");
            }
        }
    </script>

</body>
</html>
