<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 비밀 채팅 - Talk with me</title>
    <style>
        :root {
            --primary-color: #ff4b7d;
            --line-color: #06C755;
            --kakao-color: #FEE500;
            --kakao-text: #191919;
            --bg-gradient: linear-gradient(135deg, #161322 0%, #322b43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 10px;
        }

        /* 網頁核心主容器 */
        .chat-container {
            width: 100%;
            max-width: 450px;
            background: rgba(22, 20, 31, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 94vh;
            max-height: 820px;
        }

        /* 頂部頭部欄 */
        .chat-header {
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            position: relative;
        }

        .avatar-container {
            position: relative;
            margin-right: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            object-fit: cover;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            background-color: #4cd964;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid #16141f;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(76, 217, 100, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
        }

        .user-info h2 {
            font-size: 1.15rem;
            margin-bottom: 4px;
            font-weight: 600;
            color: #ffffff;
        }

        .user-info p {
            font-size: 0.85rem;
            color: #4cd964;
            font-weight: 500;
        }

        .header-tag {
            position: absolute;
            right: 20px;
            top: 24px;
            background: rgba(255, 75, 125, 0.2);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* 聊天消息區域 */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            align-self: flex-start;
            border-top-left-radius: 4px;
            transform: translateY(10px);
        }

        .message.outgoing {
            background: var(--primary-color);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .message.typing-indicator {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 20px;
            align-self: flex-start;
        }

        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #aaa;
            color: #aaa;
            animation: dotFlashing 1s infinite linear;
            display: inline-block;
            margin: 0 4px;
        }
        .dot-flashing:nth-child(2) { animation-delay: 0.2s; }
        .dot-flashing:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotFlashing {
            0%, 100% { background-color: rgba(255,255,255,0.2); }
            50% { background-color: rgba(255,255,255,0.8); }
        }

        /* 核心引流按鈕區域 */
        .action-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-title {
            text-align: center;
            font-size: 0.85rem;
            color: #b0afb8;
            margin-bottom: 4px;
        }

        .btn-sns {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-sns:active {
            transform: scale(0.98);
        }

        .btn-line {
            background-color: var(--line-color);
            color: white;
        }

        .btn-kakao {
            background-color: var(--kakao-color);
            color: var(--kakao-text);
        }

        .sns-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        /* 底部仿App輸入框 */
        .fake-input-bar {
            display: flex;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.01);
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .real-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            border-radius: 20px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        
        .real-input::placeholder {
            color: #666;
        }

        .fake-send {
            color: var(--primary-color);
            margin-left: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
        }

        /* ！！！注意！！！ 这里彻底删除了之前用来隐藏 SaleSmartly 客服的所有 display:none 样式 */
        /* 现在 SaleSmartly 原生的聊天气泡和中门大窗可以毫无保留地完美显示出来了 */
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- 頂部頭部欄 -->
        <div class="chat-header">
            <div class="avatar-container">
                <img src="https://unsplash.com" alt="Avatar" class="avatar">
                <div class="status-dot"></div>
            </div>
            <div class="user-info">
                <h2>미미 (Mimi) ❤️ 24세</h2>
                <p>🟢 실시간 접속 중...</p>
            </div>
            <div class="header-tag">🔥 1.2km 근처</div>
        </div>

        <!-- 聊天信息流區域 -->
        <div class="chat-messages" id="chatBox"></div>

        <!-- LINE 和 KakaoTalk 核心按鈕 -->
        <div class="action-area">
            <div class="action-title">✨ 아래 버튼을 눌러 미미와 비밀 대화를 시작하세요 👇</div>
            
            <!-- LINE 按钮 -->
            <a href="https://line.me" target="_blank" class="btn-sns btn-line">

                미미의 LINE 추가하기 (添加 LINE)
            </a>

            <!-- KakaoTalk 按钮 -->
            <a href="https://kakao.com" target="_blank" class="btn-sns btn-kakao">
                <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-5.52 0-10 3.478-10 7.77 0 2.76 1.83 5.185 4.58 6.56-.19.69-.69 2.51-.79 2.9.13.01.27 0 .39-.08.97-.65 4.53-3.1 5.17-3.53.22.03.43.04.65.04 5.52 0 10-3.478 10-7.77S17.52 3 12 3z"/></svg>
                미미의 카카오톡 추가 (添加 KakaoTalk)
            </a>
        </div>

        <div class="fake-input-bar">
            <input type="text" class="real-input" id="userMsgInput" placeholder="메시지를 입력하세요... (输入并发送)">
            <div class="fake-send" id="sendBtn">전송</div>
        </div>
    </div>

    <script>
