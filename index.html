<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLOBAL GOURMET STANDARD</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* 1:1 還原圖一頂部的超大圓弧裁剪效果 */
        .phone-top-curve {
            border-bottom-left-radius: 50% 15%;
            border-bottom-right-radius: 50% 15%;
        }
        /* LINE按鈕呼吸雷射光暈 */
        @keyframes pulse-line {
            0%, 100% { box-shadow: 0 0 15px 2px rgba(6, 199, 85, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 25px 8px rgba(6, 199, 85, 0.8); transform: scale(1.02); }
        }
        .animate-line {
            animation: pulse-line 2s infinite ease-in-out;
        }
    </style>
</head>
<!-- 純淨白色背景，用來強烈對比出中央的黑色手機框架 -->
<body class="bg-gray-100 font-sans antialiased select-none min-h-screen flex justify-center items-center">

    <!-- 模擬手機外殼容器 (完全鎖定手機比例，完美適配 FB 內建瀏覽器) -->
    <div class="w-full max-w-md bg-[#070F26] min-h-screen shadow-2xl flex flex-col justify-between relative overflow-hidden">
        
        <!-- =================【圖一核心：頂部大圓弧裁剪區】================= -->
        <!-- 外層用白色區塊往下壓出圓弧，完美重現圖一的黑白交界線 -->
        <div class="absolute top-0 left-0 w-full h-32 bg-white phone-top-curve z-50 pointer-events-none"></div>

        <!-- 頂部導航列 (保留圖二的高級商標，並向下平移躲開圓弧) -->
        <header class="w-full px-6 pt-24 pb-4 flex justify-between items-center border-b border-gray-800/30 z-10">
            <!-- 左側商標：亮黃色強調 -->
            <div class="text-xs font-extrabold tracking-wider text-amber-400">
                GOURMET HUB <span class="text-white">CONSULTING</span>
            </div>
            <!-- 右側極小選單 -->
            <div class="flex gap-3 text-[10px] text-gray-500">
                <span>關於我們</span>
                <span>隱私方針</span>
            </div>
        </header>

        <!-- =================【圖二核心：高質感暗黑吸粉內容】================= -->
        <main class="flex-grow flex flex-col justify-center px-6 py-8 space-y-6 z-10">
            
            <!-- 1. 金色膠囊小標籤 (1:1 還原圖二頂部) -->
            <div class="inline-block self-start bg-amber-400/10 border border-amber-400/30 rounded-full px-3 py-1">
                <span class="text-[10px] font-bold tracking-widest text-amber-400 uppercase">
                    ★ GLOBAL GOURMET STANDARD ★
                </span>
            </div>

            <!-- 2. 核心大標題 (純白大字 + 亮黃色重點) -->
            <h1 class="text-3xl font-black text-white tracking-tight leading-tight">
                全台唯一的<br>
                心理學老饕級 私廚料理 與<br>
                <span class="text-amber-400">LINE 獨家隱藏版 預訂中心</span>
            </h1>

            <!-- 3. 副標題說明文字 (高質感灰色小字) -->
            <p class="text-xs sm:text-sm text-gray-400 font-light leading-relaxed max-w-sm">
                一個人很難解決的聚餐難題，我們用科學烹調技術與私密通道為您精準呈現。
                現在加入最安全的私密官方 LINE 頻道，105% 保證享有優先訂位權與限量的專屬老饕福利。
            </p>

            <!-- 4. 急迫感提示區 -->
            <div class="bg-red-500/10 border border-red-500/20 rounded-xl p-3 flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs text-red-400 font-bold">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                    <span>今日免費私房菜名額剩餘：</span>
                </div>
                <span class="text-white font-black text-sm bg-red-600 px-2 py-0.5 rounded" id="count-num">14 位</span>
            </div>

            <!-- 5. 行動呼籲雙按鈕 (1:1 還原圖二排列方式與顏色) -->
            <div class="flex flex-col gap-3 pt-2">
                
                <!-- 按鈕 A：LINE 官方綠色按鈕 (加入動態光暈) -->
                <!-- 💡 請將 href 換成您的 LINE 連結 -->
                <a href="https://line.me" 
                   target="_blank"
                   class="animate-line w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-bold text-sm py-4 rounded-xl transition-all duration-300 transform active:scale-98 flex items-center justify-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                    <span>Official LINE 諮詢中心</span>
                </a>

                <!-- 按鈕 B：圖二的經典亮黃色按鈕 -->
                <!-- 💡 可以設定為第二個吸粉連結 -->
                <a href="https://line.me" 
                   target="_blank"
                   class="w-full bg-[#FEE500] hover:bg-[#f3db00] text-[#191919] font-bold text-sm py-4 rounded-xl transition-all duration-300 transform active:scale-98 flex items-center justify-center gap-2">
                    <span>領取 今日限量老饕招待券</span>
                </a>

            </div>

        </main>

        <!-- 6. 底部免責與版權 (1:1 還原圖二上方選單右側字體質感) -->
        <footer class="w-full text-center py-6 border-t border-gray-900 bg-[#050B1A] z-10">
            <p class="text-[9px] text-gray-650 tracking-wider">
                © 2026 GOURMET HUB. 本活動由私廚團隊獨立舉辦，個資受安全隱私條例保護。
            </p>
        </footer>

    </div>

    <!-- 讓名額產生倒數急迫感的腳本 -->
    <script>
        setInterval(() => {
            const el = document.getElementById('count-num');
            let current = parseInt(el.innerText);
            if (current > 3 && Math.random() > 0.6) {
                el.innerText = (current - 1) + " 位";
            }
        }, 7000);
    </script>

</body>
</html>
