<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 비밀 채팅 - Talk with me</title>
    <style>
        :root {
            --primary-color: #ff4b7d;
            --line-color: #06C755;
            --kakao-color: #FEE500;
            --kakao-text: #191919;
            --bg-gradient: linear-gradient(135deg, #161322 0%, #322b43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 10px;
        }

        /* 網頁核心主容器 */
        .chat-container {
            width: 100%;
            max-width: 450px;
            background: rgba(22, 20, 31, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 94vh;
            max-height: 820px;
        }

        /* 頂部頭部欄 */
        .chat-header {
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            position: relative;
        }

        .avatar-container {
            position: relative;
            margin-right: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            object-fit: cover;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            background-color: #4cd964;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid #16141f;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(76, 217, 100, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
        }

        .user-info h2 {
            font-size: 1.15rem;
            margin-bottom: 4px;
            font-weight: 600;
            color: #ffffff;
        }

        .user-info p {
            font-size: 0.85rem;
            color: #4cd964;
            font-weight: 500;
        }

        .header-tag {
            position: absolute;
            right: 20px;
            top: 24px;
            background: rgba(255, 75, 125, 0.2);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* 聊天消息區域 */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            align-self: flex-start;
            border-top-left-radius: 4px;
            transform: translateY(10px);
        }

        .message.outgoing {
            background: var(--primary-color);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .message.typing-indicator {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 20px;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .dot-container {
            display: flex;
            align-items: center;
            height: 14px;
        }

        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #aaa;
            animation: dotFlashing 1s infinite linear;
            display: inline-block;
            margin: 0 4px;
        }
        .dot-flashing:nth-child(2) { animation-delay: 0.2s; }
        .dot-flashing:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotFlashing {
            0%, 100% { background-color: rgba(255,255,255,0.2); }
            50% { background-color: rgba(255,255,255,0.8); }
        }

        /* 核心引流按鈕區域 */
        .action-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-title {
            text-align: center;
            font-size: 0.85rem;
            color: #b0afb8;
            margin-bottom: 4px;
        }

        .btn-sns {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-sns:active {
            transform: scale(0.98);
        }

        .btn-line {
            background-color: var(--line-color);
            color: white;
        }

        .btn-kakao {
            background-color: var(--kakao-color);
            color: var(--kakao-text);
        }

        /* 底部输入框拦截触发栏 */
        .fake-input-bar {
            display: flex;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.01);
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .real-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            border-radius: 20px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }
        
        .real-input::placeholder {
            color: #666;
        }

        .fake-send {
            color: var(--primary-color);
            margin-left: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
        }

        /* 隐藏右下角 Tawk.to 的原生小圆形图标，保持落地页美观 */
        iframe[title="화상 채팅 전화를 수락함"], 
        .tawk-min-container,
        #tawk-chatpanel,
        iframe[id^="tawk-"] {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.2s ease-in-out;
        }
        
        /* 当 Tawk 聊天大视窗被彻底唤醒展开时，恢复整体交互机制 */
        body.tawk-open iframe[id^="tawk-"] {
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 999999 !important;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- 頂部頭部欄 -->
        <div class="chat-header">
            <div class="avatar-container">
                <img src="https://unsplash.com" alt="Avatar" class="avatar">
                <div class="status-dot"></div>
            </div>
            <div class="user-info">
                <h2>미미 (Mimi) ❤️ 24세</h2>
                <p>🟢 실시간 접속 중...</p>
            </div>
            <div class="header-tag">🔥 1.2km 근처</div>
        </div>

        <!-- 聊天消息流區域 -->
        <div class="chat-messages" id="chat-messages-container">
            <div class="message incoming">
                오빠, 아직 안 자고 뭐해? 외로워서 메시지 보냈어.. 🙈
            </div>
            <div class="message incoming">
                여기 웹사이트는 렉이 좀 심하네.. 나랑 밤새 대화할래? 비밀 얘기하고 싶어!
            </div>
            
            <!-- 打字状态指示器 -->
            <div class="message typing-indicator" id="typing-box">
                <div class="dot-container">
                    <span class="dot-flashing"></span>
                    <span class="dot-flashing"></span>
                    <span class="dot-flashing"></span>
                </div>
            </div>
        </div>

        <!-- 核心引流按鈕區域 -->
        <div class="action-area">
            <div class="action-title">👇 미미와 끊김없이 1:1 비밀 대화하기 👇</div>
            <!-- KakaoTalk 按钮触发 -->
            <a href="javascript:void(0);" onclick="triggerTawkTo()" class="btn-sns btn-kakao">
                <span>카카오톡으로 대화하기</span>
            </a>
            <!-- LINE 按钮触发 -->
            <a href="javascript:void(0);" onclick="triggerTawkTo()" class="btn-sns btn-line">
                <span>LINE으로 대화하기</span>
            </a>
        </div>

        <!-- 底部输入框拦截触发栏 -->
        <div class="fake-input-bar">
            <input type="text" readonly class="real-input" placeholder="메시지를 입력하려면 여기에 탭하세요..." onclick="triggerTawkTo()">
            <div class="fake-send" onclick="triggerTawkTo()">전송</div>
        </div>
