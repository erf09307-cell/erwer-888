<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>遇見心動 - 在線實時暢聊</title>
    <style>
        :root {
            --primary-color: #ff4b7d;
            --line-color: #06C755;
            --kakao-color: #FEE500;
            --kakao-text: #191919;
            --bg-gradient: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 10px;
        }

        /* 網頁核心容器 */
        .chat-container {
            width: 100%;
            max-width: 450px;
            background: rgba(28, 26, 43, 0.9);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 92vh;
            max-height: 800px;
        }

        /* 頭部狀態欄 */
        .chat-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            position: relative;
        }

        .avatar-container {
            position: relative;
            margin-right: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            object-fit: cover;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            background-color: #4cd964;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid #1c1a2b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(76, 217, 100, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
        }

        .user-info h2 {
            font-size: 1.15rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .user-info p {
            font-size: 0.85rem;
            color: #4cd964;
            font-weight: 500;
        }

        /* 提示小標籤 */
        .header-tag {
            position: absolute;
            right: 20px;
            top: 25px;
            background: rgba(255, 75, 125, 0.15);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* 聊天消息區域 */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            align-self: flex-start;
            border-top-left-radius: 4px;
            transform: translateY(10px);
        }

        .message.outgoing {
            background: var(--primary-color);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .message.typing-indicator {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            align-self: flex-start;
        }

        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #aaa;
            color: #aaa;
            animation: dotFlashing 1s infinite linear;
            display: inline-block;
            margin: 0 4px;
        }
        .dot-flashing:nth-child(2) { animation-delay: 0.2s; }
        .dot-flashing:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotFlashing {
            0%, 100% { background-color: rgba(255,255,255,0.2); }
            50% { background-color: rgba(255,255,255,0.8); }
        }

        /* 核心引流按鈕區域 */
        .action-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-title {
            text-align: center;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 4px;
        }

        .btn-sns {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-sns:active {
            transform: scale(0.98);
        }

        .btn-line {
            background-color: var(--line-color);
            color: white;
        }

        .btn-kakao {
            background-color: var(--kakao-color);
            color: var(--kakao-text);
        }

        .sns-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        /* 底部真正的在線客服輸入框 */
        .fake-input-bar {
            display: flex;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.02);
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .real-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            border-radius: 20px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        
        .real-input::placeholder {
            color: #777;
        }

        .fake-send {
            color: var(--primary-color);
            margin-left: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
        }

        /* 强行隐藏 SaleSmartly 客服自带的右下角悬浮图标 */
        iframe#ss-chat, 
        .ss-chat-widget, 
        [id^="salesmartly-"], 
        .ss-widget-button,
        div[class*="salesmartly"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- 頭部導航 -->
        <div class="chat-header">
            <div class="avatar-container">
                <img src="https://unsplash.com" alt="Avatar" class="avatar">
                <div class="status-dot"></div>
            </div>
            <div class="user-info">
                <h2>Mimi (미미) ❤️ 24歲</h2>
                <p>🟢 在線等你聊天中...</p>
            </div>
            <div class="header-tag">🔥 距離 1.2km</div>
        </div>

        <!-- 聊天內容區 -->
        <div class="chat-messages" id="chatBox"></div>

        <!-- 強引流轉跳按鈕區域 -->
        <div class="action-area">
            <div class="action-title">✨ 點擊下方按鈕，立刻和她私密暢聊 👇</div>
            
            <!-- LINE 轉跳按鈕 - 上线前请记得修改 href 后面的加友网址 -->
            <a href="https://line.me" target="_blank" class="btn-sns btn-line">

                添加我的 LINE 賬號
            </a>

            <!-- KakaoTalk 轉跳按鈕 - 上线前请记得修改 href 后面的加友网址 -->
            <a href="https://kakao.com" target="_blank" class="btn-sns btn-kakao">
                <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-5.52 0-10 3.478-10 7.77 0 2.76 1.83 5.185 4.58 6.56-.19.69-.69 2.51-.79 2.9.13.01.27 0 .39-.08.97-.65 4.53-3.1 5.17-3.53.22.03.43.04.65.04 5.52 0 10-3.478 10-7.77S17.52 3 12 3z"/></svg>
                添加我的 KakaoTalk
            </a>
        </div>

        <!-- 視覺+真實客服輸入框 -->
        <div class="fake-input-bar">
