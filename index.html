<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>頂級私房美食 - 限時獨家入群福利</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* 按鈕輕微呼吸動畫，增加點擊率 */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.95; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2.5s infinite ease-in-out;
        }
    </style>
</head>
<!-- 使用與圖片相同的深藍黑色背景 (#0B132B 或泰坦黑) -->
<body class="bg-[#070F26] font-sans antialiased text-gray-200 select-none min-h-screen flex flex-col justify-between">

    <!-- 頂部導航列 (還原圖片上方商標與小選單) -->
    <header class="w-full max-w-4xl mx-auto px-6 py-4 flex justify-between items-center border-b border-gray-800/50">
        <!-- 左側商標：亮黃色強調 -->
        <div class="text-sm font-extrabold tracking-wider text-amber-400">
            GOURMET HUB <span class="text-white">CONSULTING</span>
        </div>
        <!-- 右側極小極簡選單 -->
        <nav class="hidden sm:flex gap-4 text-[11px] text-gray-400">
            <a href="#" class="hover:text-white transition">關於我們</a>
            <a href="#" class="hover:text-white transition">隱私政策</a>
            <a href="#" class="hover:text-white transition">服務條款</a>
        </nav>
    </header>

    <!-- 主內容區：置中排版 -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-xl w-full text-left space-y-6">
            
            <!-- 1. 頂部金色膠囊小標籤 -->
            <div class="inline-block bg-amber-400/10 border border-amber-400/30 rounded-full px-4 py-1">
                <span class="text-[10px] sm:text-xs font-bold tracking-widest text-amber-400 uppercase">
                    ★ GLOBAL GOURMET STANDARD ★
                </span>
            </div>

            <!-- 2. 核心大標題 (還原圖片：純白大字 + 亮黃色重點) -->
            <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight leading-tight">
                全台唯一的<br>
                心理學老饕級 私廚料理 與<br>
                <span class="text-amber-400">LINE 獨家隱藏版 預訂中心</span>
            </h1>

            <!-- 3. 副標題/說明文字 (還原圖片：高質感灰色小字) -->
            <p class="text-sm sm:text-base text-gray-400 font-light leading-relaxed max-w-md">
                一個人很難訂到的夢幻私房菜，我們用最嚴格的食材與科學烹調技術為您精準呈現。
                現在加入最安全的私密官方 LINE 頻道，100% 保證享有優先訂位權與限量老饕福利。
            </p>

            <!-- 4. 行動呼籲按鈕區塊 (還原圖片：雙按鈕排版) -->
            <div class="flex flex-col sm:flex-row gap-3 pt-4">
                
                <!-- 按鈕 A：LINE 官方綠色按鈕 -->
                <!-- 💡 請將 href 換成您的 LINE 連結 -->
                <a href="https://line.me" 
                   target="_blank"
                   class="animate-pulse-soft flex-1 bg-[#06C755] hover:bg-[#05b34c] text-white font-bold text-sm py-4 px-6 rounded-lg transition-all duration-300 transform active:scale-98 flex items-center justify-center gap-2 shadow-lg shadow-[#06C755]/20">
                    <!-- LINE 簡約圖標 -->
                    <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
                    <span>Official LINE 預訂中心</span>
                </a>

                <!-- 按鈕 B：備用跳轉或活動按鈕 (還原圖片的亮黃色按鈕) -->
                <!-- 💡 可以設定為第二個吸粉誘因，例如直接跳去領券 -->
                <a href="https://line.me" 
                   target="_blank"
                   class="flex-1 bg-[#FEE500] hover:bg-[#f3db00] text-[#191919] font-bold text-sm py-4 px-6 rounded-lg transition-all duration-300 transform active:scale-98 flex items-center justify-center gap-2 shadow-lg shadow-[#FEE500]/10">
                    <span>領取 今日私房小菜招待券</span>
                </a>

            </div>

        </div>
    </main>

    <!-- 底部版權宣告 -->
    <footer class="w-full text-center py-6 border-t border-gray-900 bg-[#050B1A]">
        <p class="text-[10px] text-gray-600 tracking-wider">
            © 2026 GOURMET HUB. 本活動由私廚團隊獨立舉辦，個資受安全隱私條例保護。
        </p>
    </footer>

</body>
</html>
